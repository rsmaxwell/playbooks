---
- name: 0035 Step 8 | Retention and restore source readiness
  hosts: mars
  become: true
  gather_facts: false
  tasks:
    - name: Check source guardrails and snapshot history (read only)
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/local/sbin/btrfs-snapshot-manager status
        /usr/local/sbin/diaries-snapshot-cleanup --host mars dry-run
        /usr/local/sbin/diaries-backup-history --json list
        python3 - <<'PYCODE'
        import json,re,subprocess
        from pathlib import Path
        root=Path('/media/usb/@snapshots')
        pins=json.loads((root/'.replication-protection.json').read_text())['protected']
        holds=json.loads((root/'.checkpoint-holds.json').read_text())['holds']
        assert pins and holds, 'required replication pins and checkpoint holds absent'
        for timestamp in set(pins)|set(holds):
            assert re.fullmatch(r'\d{8}-\d{6}Z',timestamp),timestamp
            for source in ('root','@data'):
                path=root/source/timestamp
                assert path.is_dir() and not path.is_symlink(),path
                result=subprocess.run(['btrfs','property','get','-ts',str(path),'ro'],capture_output=True,text=True,check=True,timeout=20)
                assert result.stdout.strip()=='ro=true',path
        for timestamp,uuid in pins.items():
            result=subprocess.run(['btrfs','subvolume','show',str(root/'@data'/timestamp)],capture_output=True,text=True,check=True,timeout=20)
            actual=next((line.split(':',1)[1].strip() for line in result.stdout.splitlines() if line.strip().startswith('UUID:')),None)
            assert actual==uuid,(timestamp,actual,uuid)
        print(f'PASS: {len(pins)} replication pins and {len(holds)} checkpoint holds present, readonly, UUID checked')
        print('NOTE: historical Snapper snapshots are outside the managed cleanup namespace')
        PYCODE
      args:
        executable: /bin/bash
      register: mars_acceptance
      changed_when: false
    - ansible.builtin.debug:
        var: mars_acceptance.stdout_lines

- name: 0035 Step 8 | Passive receiver readiness
  hosts: backup
  become: true
  gather_facts: false
  tasks:
    - name: Check receipt/received identity, parents and legacy mirror (read only)
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import json,re,subprocess
        from pathlib import Path
        root=Path('/@data/mars-received/@data')
        state=Path('/@data/mars-received/.replication-state')
        assert Path('/@data/backup').is_dir(), 'legacy backup mirror missing'
        stamps={p.name for p in root.iterdir() if re.fullmatch(r'\d{8}-\d{6}Z',p.name)}
        receipts={p.stem for p in state.glob('*.json') if re.fullmatch(r'\d{8}-\d{6}Z',p.stem)}
        assert stamps and stamps==receipts,(sorted(stamps-receipts),sorted(receipts-stamps))
        for stamp in sorted(stamps):
            receipt=json.loads((state/(stamp+'.json')).read_text())
            parent=receipt.get('parent_snapshot')
            assert parent is None or parent in receipts,(stamp,parent)
            path=root/stamp
            assert not path.is_symlink()
            info=subprocess.run(['btrfs','subvolume','show',str(path)],capture_output=True,text=True,check=True,timeout=20).stdout
            received=next((line.split(':',1)[1].strip() for line in info.splitlines() if line.strip().startswith('Received UUID:')),None)
            assert received==receipt.get('source_uuid')==receipt.get('received_uuid'),stamp
            ro=subprocess.run(['btrfs','property','get','-ts',str(path),'ro'],capture_output=True,text=True,check=True,timeout=20)
            assert ro.stdout.strip()=='ro=true',stamp
        print('PASS: received snapshots/receipts/UUIDs/parent chains consistent:',len(stamps))
        print('PASS: legacy /@data/backup present')
        PYCODE
        for t in btrfs-snapshot-create.timer btrfs-snapshot-prune.timer; do
          state=$(systemctl is-enabled "$t" 2>/dev/null || true)
          test "$state" = disabled || { echo "FAIL: $t=$state"; exit 1; }
        done
        echo 'PASS: backup snapshot timers disabled'
      args:
        executable: /bin/bash
      register: backup_acceptance
      changed_when: false
    - ansible.builtin.debug:
        var: backup_acceptance.stdout_lines

- name: 0035 Step 8 | Published source remains visible
  hosts: pluto
  become: true
  gather_facts: false
  tasks:
    - name: Verify history discoverability and non-Btrfs no-op
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/local/sbin/diaries-backup-history --published-root /home/richard/projects/diaries/data/diaries-backup list
        /usr/local/sbin/diaries-snapshot-cleanup --host pluto dry-run
      args:
        executable: /bin/bash
      register: pluto_acceptance
      changed_when: false
    - ansible.builtin.debug:
        var: pluto_acceptance.stdout_lines
