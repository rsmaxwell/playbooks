---
# First-run bootstrap and later setup share the same SSH server policy.
# WARNING: port changes require a staged old+new-port migration to avoid lockout.
- name: Require configured SSH port
  ansible.builtin.assert:
    that:
      - configured_port is defined
      - (configured_port | int) >= 1
      - (configured_port | int) <= 65535
    fail_msg: "Set configured_port before changing sshd."

- name: Configure SSH daemon port
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*Port\s+'
    line: "Port {{ configured_port }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH daemon

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*PasswordAuthentication\s+'
    line: 'PasswordAuthentication no'
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH daemon
