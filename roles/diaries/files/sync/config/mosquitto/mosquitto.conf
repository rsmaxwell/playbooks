
listener 1883
socket_domain ipv4

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/pwfile.txt

log_type error
log_type warning
#log_type notice
#log_type information
#log_type all

acl_file /mosquitto/config/aclfile.txt

# Retained-snapshot correctness safeguard.
# Revisit a bounded queue only after a bounded complete-snapshot protocol exists.
max_inflight_messages 20
max_queued_messages 0

# Allow image-upload RPC packets up to 32 MiB
max_packet_size 33554432
