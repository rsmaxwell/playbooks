---

- name: Create btrfs subvolume
  ansible.builtin.script: 
    cmd: initialise_btrfs_subvolume.py {{ btrfs_filesystem_path }} {{ btrfs_subvolume_path }}  {{ btrfs_subvolume_limit }}
    executable: /usr/bin/python3
  register: result
  changed_when: result.rc >= 1
  failed_when: result.rc >= 2

- name: Show Btrfs creation output
  ansible.builtin.debug:
    var: result.stdout_lines
  when:
    - result is defined
    - result.stdout_lines is defined





- name: Set file permissions for the btrfs subvolume
  ansible.builtin.file: 
    path: "{{ btrfs_subvolume_path }}"
    mode: '0777'
