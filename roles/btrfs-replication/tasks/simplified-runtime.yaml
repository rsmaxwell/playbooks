---
# 0045-FEAT phase: Install shared agreed-parent runtime and status tool.
- name: Native Btrfs | Install simplified agreed-parent command (opt in)
  ansible.builtin.copy:
    src: btrfs-simplified-replication.py
    dest: /usr/local/bin/btrfs-simplified-replication
    owner: root
    group: root
    mode: '0755'
  become: true
  when: btrfs_simplified_replication_install_enabled | bool
  tags: [native-btrfs, simplified-agreed-parent]

# Source-side summary must use the same active simplified agreed-parent
# protocol, not the legacy push/receipt format. Installation is file-only.
- name: Native Btrfs | Install simplified Diaries backup status report
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/roles/snapshots/files/diaries-backup-status.py'
    dest: /usr/local/sbin/diaries-backup-status
    owner: root
    group: root
    mode: '0755'
  become: true
  when:
    - btrfs_native_endpoint_role == 'source'
    - btrfs_simplified_replication_active_enabled | bool
  tags: [native-btrfs, simplified-agreed-parent]

# 0040 Step 12: install shared-manager receiver retention while leaving the
# deletion gate/timer off. Explicit inventory opt-in; never starts pruning.
