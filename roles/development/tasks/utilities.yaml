---


- name: development:utilities | Install utility packages
  ansible.builtin.apt:
    name:
      - maven
      - build-essential
      - zip
      - unzip
      - python3-pip
    state: present
    update_cache: true
  become: true



- name: Install python tools
  ansible.builtin.pip: 
    name: "{{ item }}"
  loop:
    - pyyaml
    - yq





