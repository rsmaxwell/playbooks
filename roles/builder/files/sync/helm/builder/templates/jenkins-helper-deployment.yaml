apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-helper
  namespace: jenkins
spec:
  replicas: {{ .Values.replicas.helper }}
  selector:
    matchLabels:
      app: {{ .Values.podLabels.helper }}
  template:
    metadata:
      labels:
        app: {{ .Values.podLabels.helper }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
      containers:
        - name:  {{ .Values.container.helper }}
          image: {{ .Values.image.jenkins.name }}:{{ .Values.image.jenkins.tag }}
          command: ["bash", "-xc"]
          args:
            - tail -f /dev/null
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
      volumes:
        - name: jenkins-data
          hostPath:
          persistentVolumeClaim:
              claimName: jenkins-pvc

