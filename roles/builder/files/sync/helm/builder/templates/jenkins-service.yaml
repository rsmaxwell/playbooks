---

apiVersion: v1
kind: Service
metadata:
  name: jenkins-service
spec:
  selector: 
    app: jenkins
  type: NodePort  
  ports:
    - name: httpport
      port: {{ .Values.ports.http.port }}
      targetPort: {{ .Values.ports.http.targetPort }}
      nodePort: {{ .Values.ports.http.nodePort }}
    - name: ssh
      port: {{ .Values.ports.ssh.port }}
      targetPort: {{ .Values.ports.ssh.targetPort }}
      nodePort: {{ .Values.ports.ssh.nodePort }}
    - name: jnlp
      port: {{ .Values.ports.jnlp.port }}
      targetPort: {{ .Values.ports.jnlp.targetPort }}
      nodePort: {{ .Values.ports.jnlp.nodePort }}
