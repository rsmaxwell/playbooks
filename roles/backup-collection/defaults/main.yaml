---

# 0034/0035 permanent Diaries receive configuration. Installation remains
# disabled until the operator deliberately opts in for mars; the role never
# schedules or executes a Diaries transfer.
diaries_pull_install: false
# 0036 guarded fixed working dataset receiver; legacy remains the default.
diaries_pull_fixed_destination_enabled: false
diaries_pull_fixed_source_guard: /home/richard/projects/diaries/scripts/fixed-dataset-source-guard.py
diaries_pull_host: pluto
diaries_pull_source_parent: /home/richard/projects/diaries/data
diaries_pull_destination_parent: /media/usb/@data/backup/pluto
diaries_pull_snapshot_source_root: /media/usb/@data
diaries_pull_verification_marker: /media/usb/@data/backup/.diaries-snapshot-verified.json
diaries_pull_repository_lock: /media/usb/@data/backup/.btrfs-snapshot-writer.lock
diaries_pull_script_dir: "{{ normal_user_home }}/scripts/backup"

# When true, the included snapshots role requires the marker/lock generated by
# diaries-pull before any manual or scheduled native snapshot can be created.
diaries_snapshot_integration_enabled: false
diaries_snapshot_source_name: "@data"
diaries_snapshot_diaries_relative_path: backup/pluto/diaries-backup
diaries_snapshot_marker_relative_path: backup/.diaries-snapshot-verified.json

# 0034 Step 10 Item 4. Explicit opt-in: grant only the normal mars account
# read/traverse access to the *writable* source, not existing read-only snapshots.
# Recursive ACL updates can be costly on a large backup tree; schedule offline.
diaries_snapshot_source_acl_enabled: false
diaries_snapshot_source_acl_user: "{{ ansible_user }}"
diaries_snapshot_source_acl_path: /media/usb/@data/backup

# 0034 Step 11.4 unattended receive. The timer is installed only when the
# permanent Diaries pull helper is installed, and stays disabled by default.
diaries_pull_schedule_enabled: false
diaries_pull_on_calendar: "*-*-* 01:30:00 UTC"
diaries_pull_timeout_start_sec: 2h

# Historical mars -> backup rsync remains available only as an explicit rollback
# transport. Set false before enabling native off-site replication so exactly one
# off-site writer is active. Kept true by default to avoid changing existing hosts
# merely by upgrading source before the Step 11.4 cutover.
legacy_remote_rsync_push_enabled: true

# 0034 Step 11.4: finish user home/cron backup before the hourly 02:00
# native Btrfs snapshot. The writer lock still guards any overrun.
local_backup_user_cron_hour: "1"
local_backup_user_cron_minute: "45"
