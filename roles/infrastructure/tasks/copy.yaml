---


- name: infrastructure:copy | Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ projects_dir }}"
    - "{{ infrastructure_project_dir }}"
    - "{{ infrastructure_project_dir }}/scripts"




- name: infrastructure:copy | Sync content
  ansible.posix.synchronize:
    src: sync/
    dest: "{{ infrastructure_project_dir }}/"
    rsync_opts:
      - "--omit-dir-times"
  register: result
- debug:
    var: result.stdout_lines


- name: infrastructure:copy | Template files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ infrastructure_project_dir }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "compose/compose.yaml.j2", dest: "compose.yaml", mode: "0600" }
    - { src: "compose/.env.j2", dest: ".env", mode: "0644" }
    - { src: "nginx/config/conf.d/site.conf.j2", dest: "nginx/config/conf.d/site.conf", mode: "0644" }


- name: infrastructure:copy | Install infrastructure systemd unit
  become: true
  ansible.builtin.template:
    src: compose/infrastructure-compose.service.j2
    dest: /etc/systemd/system/infrastructure-compose.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart systemd
    - Restart infrastructure stack
  register: result

- debug:
    msg: "{{ result }}"


